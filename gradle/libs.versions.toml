[versions]
agp = "9.3.2"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.10"
composeBom = "2026.08.00"
datastore-preferences = "1.2.1"
kotlinxSerialization = "1.11.0"
kotlinx-datetime = "0.8.0"
biometric = "1.4.0-alpha07"
fragment = "1.9.0"
core-splashscreen = "1.2.0"

# Retrofit
retrofit = "3.0.0"
converter-gson = "3.0.0"
converter-scalars = "3.0.0"
logging-interceptor = "5.5.0"
navigationCompose = "2.9.8"

# Skeleton Loading
compose-shimmer = "1.5.0"

# Date to Human Readable
human-readbale = "1.13.1"

# SemVer
semver = "3.1.0"

# Ansi Parser
android-ansi = "1.2.0"

# Charts
#vico = "3.0.3"
compose-charts = "1.0.0"

# Code Highlighting
highlight = "2.3.0"

# Gravatar
gravatar = "2.5.1"

# AvatarKt
avatar-kt = "0.3.0"

# KAML
kaml = "0.104.0"

# Play Store In-App Updates
app-update = "2.1.0"
kotlinx-coroutines-play-services = "1.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore-preferences" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }

# Retrofit
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "converter-gson" }
retrofit-converter-scalars = { group = "com.squareup.retrofit2", name = "converter-scalars", version.ref = "converter-scalars" }
retrofit-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "logging-interceptor" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Skeleton Loading
compose-shimmer = { group = "com.valentinilk.shimmer", name = "compose-shimmer", version.ref = "compose-shimmer" }

# Date to Human Readable
human-readable = { group = "nl.jacobras", name = "Human-Readable", version.ref = "human-readbale" }

# SemVer
semver = { group = "io.github.z4kn4fein", name = "semver", version.ref = "semver" }

# Ansi Parser
android-ansi = { group = "com.github.Fox2Code.AndroidANSI", name = "library", version.ref = "android-ansi" }
android-ansi-ktx = { group = "com.github.Fox2Code.AndroidANSI", name = "library-ktx", version.ref = "android-ansi" }

# Charts
#vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
#vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
compose-charts = { group = "io.github.ehsannarmani", name = "compose-charts", version.ref = "compose-charts" }

# Code Highlighting
highlight-view = { group = "com.neoutils.highlight", name = "highlight-view", version.ref = "highlight" }
highlight-compose = { group = "com.neoutils.highlight", name = "highlight-compose", version.ref = "highlight" }

# Gravatar
gravatar = { group = "com.gravatar", name = "gravatar", version.ref = "gravatar" }
gravatar-ui = { group = "com.gravatar", name = "gravatar-ui", version.ref = "gravatar" }

# AvatarKt
avatar-kt = { group = "io.github.feliperce", name = "avatarkt", version.ref = "avatar-kt" }

# YAML
kaml = { group = "com.charleskorn.kaml", name = "kaml", version.ref = "kaml" }

# Play Store In-App Updates
app-update = { group = "com.google.android.play", name = "app-update", version.ref = "app-update" }
app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "app-update" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines-play-services" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "kotlin-parcelize" }
